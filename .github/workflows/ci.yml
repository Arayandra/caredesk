name: CareDesk CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Laravel tests and frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: caredesk_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: caredesk_test
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, ctype, curl, dom, fileinfo, mbstring, openssl, pdo_mysql, tokenizer, xml, zip
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Laravel environment
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate application key
        run: php artisan key:generate --force

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build Vue frontend
        run: npm run build

      - name: Run database migrations and demo seeders
        run: php artisan migrate:fresh --seed --force
        env:
          CAREDESK_DEMO_NAME: CareDesk CI
          CAREDESK_DEMO_EMAIL: staff@caredesk.test
          CAREDESK_DEMO_PASSWORD: ci-caredesk-password

      - name: Verify seeded staff credentials
        run: |
          php -r 'require "vendor/autoload.php"; $app = require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); $user = App\Models\User::where("email", "staff@caredesk.test")->first(); if (!$user) { fwrite(STDERR, "Demo staff account was not seeded\n"); exit(1); } if (!Illuminate\Support\Facades\Hash::check("ci-caredesk-password", $user->password)) { fwrite(STDERR, "Seeded staff password does not match\n"); exit(1); } echo "Seeded staff credentials verified\n";'
        env:
          CAREDESK_DEMO_EMAIL: staff@caredesk.test
          CAREDESK_DEMO_PASSWORD: ci-caredesk-password

      - name: Run automated tests
        run: php artisan test

      - name: Smoke-test the running application
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/caredesk-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:8000/ -o /tmp/caredesk-home.html; then
              break
            fi
            sleep 1
          done

          grep -q 'CareDesk' /tmp/caredesk-home.html

          TOKEN=$(curl --silent --show-error --fail \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -d '{"email":"staff@caredesk.test","password":"ci-caredesk-password"}' \
            http://127.0.0.1:8000/api/auth/login | php -r '$data = json_decode(stream_get_contents(STDIN), true); if (!isset($data["token"])) { fwrite(STDERR, "Login did not return a bearer token\n"); exit(1); } echo $data["token"];')

          curl --silent --show-error --fail \
            -H "Authorization: Bearer $TOKEN" \
            http://127.0.0.1:8000/api/dashboard > /tmp/caredesk-dashboard.json

          php -r '$data = json_decode(file_get_contents("/tmp/caredesk-dashboard.json"), true); if (!isset($data["stats"]["patients"], $data["week"])) { fwrite(STDERR, "Invalid dashboard response\n"); exit(1); } echo "Authenticated HTTP smoke test passed\n";'

      - name: Verify Laravel routes
        run: php artisan route:list --except-vendor
